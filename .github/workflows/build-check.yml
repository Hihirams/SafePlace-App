name: Build check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing, no publish)
        run: |
          xcodebuild \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="0"
