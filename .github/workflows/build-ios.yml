name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild \
            -project SafePlace.xcodeproj \
            -list

      - name: Build archive
        run: |
          xcodebuild \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SafePlace.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            "$RUNNER_TEMP/SafePlace.xcarchive/Products/Applications/SafePlace.app" \
            Payload/
          zip -r SafePlace.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafePlace-IPA
          path: SafePlace.ipa