name: Build iOS IPA

# Dos rutas:
# - Código de la app, proyecto y tests -> test + IPA + release + Pages.
# - Landing y generador del feed -> solo Pages, sin compilar.
on:
  push:
    branches: [main]
    paths:
      - 'SafePlace/**'
      - 'SafePlaceShare/**'
      - 'SafePlaceTests/**'
      - 'SafePlaceUITests/**'
      - 'SafePlace.xcodeproj/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: safeplace-release
  cancel-in-progress: false

env:
  APP_NAME: SafePlace
  BUNDLE_ID: com.hihirams.safeplace
  MIN_OS: "17.0"
  REPO: Hihirams/SafePlace-App
  PAGES_URL: https://hihirams.github.io/SafePlace-App
  VERSION: 1.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.areas.outputs.app }}
      docs: ${{ steps.areas.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar qué carpetas cambiaron
        id: areas
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # Ejecución manual o base desconocida: se compila todo.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución completa (manual o base desconocida)."
            exit 0
          fi

          app=false
          docs=false
          while IFS= read -r file; do
            case "$file" in
              SafePlace/*|SafePlaceShare/*|SafePlaceTests/*|SafePlaceUITests/*|SafePlace.xcodeproj/*|scripts/check_*) app=true ;;
              docs/*|scripts/write_source_json.sh|.github/workflows/build-ios.yml) docs=true ;;
            esac
          done < <(git diff --name-only "$before" "$after")

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "Cambios -> app=$app docs=$docs"

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check localization coverage
        run: python3 scripts/check_localization.py

      - name: Check design rules
        run: python3 scripts/check_design.py

      - name: Run tests
        run: |
          set -euo pipefail
          if xcrun simctl list devices available | grep -q "iPhone 16"; then DEVICE="iPhone 16"; else DEVICE="iPhone 15"; fi
          echo "Using simulator: $DEVICE"
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SafePlace.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            "$RUNNER_TEMP/SafePlace.xcarchive/Products/Applications/SafePlace.app" \
            Payload/
          zip -r SafePlace.ipa Payload
          rm -rf Payload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ env.VERSION }} (build ${{ env.BUILD }})
          body: |
            Build automático de `${{ github.sha }}`.

            Instala/actualiza en LiveContainer con la AltSource:
            ${{ env.PAGES_URL }}/source.json
          files: SafePlace.ipa
          make_latest: true

      - name: Generate AltSource
        run: |
          set -euo pipefail
          export SIZE=$(stat -f%z SafePlace.ipa)
          export DATE=$(date -u +%Y-%m-%d)
          bash scripts/write_source_json.sh docs/source.json
          echo "---- docs/source.json ----"
          cat docs/source.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  pages:
    name: Desplegar landing (solo docs)
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.app != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate AltSource from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$REPO/releases/latest")
          tag=$(printf '%s' "$release" | jq -r '.tag_name')
          case "$tag" in
            build-*) ;;
            *) echo "Tag inesperado: $tag" >&2; exit 1 ;;
          esac
          BUILD="${tag#build-}"
          VERSION="1.$BUILD"
          DATE=$(printf '%s' "$release" | jq -r '.published_at[0:10]')
          SIZE=$(printf '%s' "$release" | jq -r '.assets[0].size')
          if [ -z "$SIZE" ] || [ "$SIZE" = "null" ]; then
            echo "El release $tag no tiene IPA adjunto." >&2
            exit 1
          fi
          export BUILD VERSION DATE SIZE
          bash scripts/write_source_json.sh docs/source.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
