name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: safeplace-release
  cancel-in-progress: false

env:
  APP_NAME: SafePlace
  BUNDLE_ID: com.hihirams.safeplace
  MIN_OS: "17.0"
  REPO: Hihirams/SafePlace-App
  PAGES_URL: https://hihirams.github.io/SafePlace-App
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          set -euo pipefail
          if xcrun simctl list devices available | grep -q "iPhone 16"; then DEVICE="iPhone 16"; else DEVICE="iPhone 15"; fi
          echo "Using simulator: $DEVICE"
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild \
            -project SafePlace.xcodeproj \
            -scheme SafePlace \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SafePlace.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            "$RUNNER_TEMP/SafePlace.xcarchive/Products/Applications/SafePlace.app" \
            Payload/
          zip -r SafePlace.ipa Payload
          rm -rf Payload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} ${{ env.VERSION }} (build ${{ env.BUILD }})
          body: |
            Build automático de `${{ github.sha }}`.

            Instala/actualiza en LiveContainer con la AltSource:
            ${{ env.PAGES_URL }}/source.json
          files: SafePlace.ipa
          make_latest: true

      - name: Generate AltSource
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z SafePlace.ipa)
          DATE=$(date -u +%Y-%m-%d)
          RELEASE_URL="https://github.com/$REPO/releases/download/build-$BUILD/SafePlace.ipa"
          mkdir -p docs
          cat > docs/source.json <<EOF
          {
            "name": "$APP_NAME",
            "identifier": "$BUNDLE_ID.source",
            "sourceURL": "$PAGES_URL/source.json",
            "subtitle": "Builds personales de $APP_NAME",
            "description": "Builds automáticos de $APP_NAME para LiveContainer.",
            "iconURL": "$PAGES_URL/icon.png",
            "apps": [
              {
                "name": "$APP_NAME",
                "bundleIdentifier": "$BUNDLE_ID",
                "developerName": "Hihirams",
                "subtitle": "Guarda las pequeñas cosas que te ayudan",
                "localizedDescription": "App de iPhone para guardar hábitos, personas, lugares, música y autocuidado.",
                "iconURL": "$PAGES_URL/icon.png",
                "tintColor": "FF4D8B",
                "category": "lifestyle",
                "versions": [
                  {
                    "version": "$VERSION",
                    "buildVersion": "$BUILD",
                    "date": "$DATE",
                    "localizedDescription": "Build $BUILD ($DATE)",
                    "downloadURL": "$RELEASE_URL",
                    "size": $SIZE,
                    "minOSVersion": "$MIN_OS"
                  }
                ]
              }
            ]
          }
          EOF
          echo "---- docs/source.json ----"
          cat docs/source.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
